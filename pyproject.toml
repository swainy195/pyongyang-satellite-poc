[project]
name = "pyongyang-satellite-pipelines"
version = "0.1.0"
description = "ETL and Google Earth Engine pipelines"
requires-python = ">=3.12"
dependencies = [
  "earthengine-api>=1.5",
  "geopandas>=1.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyproj>=3.7",
  "python-dotenv>=1.0",
  "shapely>=2.0",
  "sqlalchemy>=2.0",
  "supabase>=2.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
